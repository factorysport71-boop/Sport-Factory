<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Entrenamiento - Sport Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0b0c10; color: #e2e8f0; padding: 20px; max-width: 900px; margin: 0 auto; padding-bottom: 120px; }
        .top-bar { height: 4px; background: linear-gradient(90deg, #22c55e, #16a34a, #4ade80); border-radius: 2px; margin-bottom: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header-logo-container { display: flex; align-items: center; gap: 14px; }

        .badge { background: #22c55e; color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; }
        h1 { font-size: 22px; font-weight: 900; text-transform: uppercase; margin-top: 2px; }
        
        /* Pantalla de Login con la imagen de fondo exacta que enviaste */
        #login-screen { 
            position: relative;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 75vh; 
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #232936;
            background-color: #0b0c10;
            background-image: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 40px 20px;
        }

        /* Capa oscura sutil para contraste */
        #login-screen::before { content: none; }

        .login-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }

        .animal-logo {
            width: min(520px, 92%);
            height: auto;
            display: block;
            object-fit: contain;
            margin: 0 auto 35px;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.45));
            transform-style: preserve-3d;
            transform-origin: center center;
            animation: logo3D 5s ease-in-out infinite;
            will-change: transform, filter;
        }

        @keyframes logo3D {
            0%, 100% {
                transform: perspective(900px) rotateY(-7deg) rotateX(2deg) translateY(0) scale(1);
                filter: drop-shadow(0 10px 25px rgba(0,0,0,0.45));
            }
            25% {
                transform: perspective(900px) rotateY(7deg) rotateX(-2deg) translateY(-5px) scale(1.015);
                filter: drop-shadow(10px 15px 30px rgba(22, 120, 70, 0.45));
            }
            50% {
                transform: perspective(900px) rotateY(0deg) rotateX(3deg) translateY(-8px) scale(1.025);
                filter: drop-shadow(0 18px 35px rgba(22, 140, 80, 0.55));
            }
            75% {
                transform: perspective(900px) rotateY(-7deg) rotateX(-2deg) translateY(-5px) scale(1.015);
                filter: drop-shadow(-10px 15px 30px rgba(22, 120, 70, 0.45));
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .animal-logo {
                animation: none;
            }
        }

        /* Botón "¿Estás listo para entrenar como un Animal?" */
        .btn-ready {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 18px 28px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 15px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5);
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 0.5px;
            width: 100%;
        }

        .btn-ready:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(22, 163, 74, 0.6);
        }

        .home-buttons { width: 100%; display: block; }
        .btn-encuesta {
            margin-top: 12px;
            background: transparent;
            color: #fff;
            border: 1px solid #22c55e;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.2);
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 0.5px;
            width: 100%;
        }

        @media (hover: hover) {
        .btn-encuesta:hover {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(34, 197, 94, 0.4);
        }
        }

        /* Tarjeta del formulario desplegable */
        .login-card { 
            display: none;
            background: rgba(21, 25, 35, 0.95); 
            backdrop-filter: blur(12px);
            border: 1px solid #2d3748; 
            border-radius: 14px; 
            padding: 30px 25px; 
            width: 100%; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            text-align: center; 
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card h2 { margin-bottom: 20px; font-size: 18px; text-transform: uppercase; color: #fff; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 5px; }
        .form-input { width: 100%; padding: 12px; background: #0f1219; border: 1px solid #232936; border-radius: 6px; color: #fff; font-size: 14px; }
        .form-input:focus { border-color: #22c55e; outline: none; }
        .btn-login { width: 100%; padding: 12px; background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; border: none; border-radius: 6px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 10px; font-size: 13px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
        .btn-login:hover { opacity: 0.9; }
        
        .btn-back { background: transparent; border: none; color: #94a3b8; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        .btn-back:hover { color: #fff; }

        .error-msg { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; font-weight: 600; }

        .web-link { margin-top: 22px; color: #4ade80; font-size: 13px; font-weight: 700; text-decoration: none; letter-spacing: 0.5px; }
        .web-link:hover { text-decoration: underline; }

        /* Firma en el costado inferior */
        .signature {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 2;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }


        /* ===== REFINAMIENTO VISUAL: elegante y sobrio ===== */
        body { background: radial-gradient(ellipse at 50% 0%, #0e2418 0%, #070b09 55%, #050706 100%) fixed; }
        .top-bar { height: 1px; background: linear-gradient(90deg, transparent, #22c55e 30%, #4ade80 50%, #22c55e 70%, transparent); border-radius: 0; margin-bottom: 26px; }
        .badge { background: transparent; color: #4ade80; border: 1px solid rgba(74,222,128,0.45); font-size: 9px; font-weight: 600; padding: 5px 12px; letter-spacing: 3px; }
        header strong { font-weight: 500 !important; font-size: 11px; letter-spacing: 4px; color: #86efac !important; }
        h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 30px; letter-spacing: 1px; text-transform: none; margin-top: 8px; }

        #login-screen { padding-bottom: 100px; border: 1px solid rgba(74,222,128,0.14); border-radius: 22px; min-height: 78vh;
            background: radial-gradient(ellipse at 50% 30%, rgba(34,197,94,0.13) 0%, rgba(7,11,9,0) 62%), linear-gradient(180deg, #0a120d 0%, #060908 100%);
            box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04); }
        #login-screen::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(74,222,128,0.08); border-radius: 15px; pointer-events: none; }

        .animal-logo { width: min(400px, 78%); margin: 0 auto 18px; animation: logoFlota 7s ease-in-out infinite; filter: drop-shadow(0 12px 40px rgba(34,197,94,0.28)); }
        @keyframes logoFlota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

        .tagline { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 22px; color: #bbf7d0; letter-spacing: 1px; text-align: center; }
        .divider { display: flex; align-items: center; gap: 14px; width: 70%; margin: 18px 0 28px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(74,222,128,0.5)); }
        .divider::after { background: linear-gradient(270deg, transparent, rgba(74,222,128,0.5)); }
        .divider i { width: 6px; height: 6px; background: #4ade80; transform: rotate(45deg); display: block; }

        .btn-encuesta { background: rgba(255,255,255,0.02); border: 1px solid rgba(74,222,128,0.5); border-radius: 12px; padding: 17px 24px; font-size: 12px; font-weight: 600; letter-spacing: 3px; color: #f0fdf4; box-shadow: none; margin-top: 14px; }
        .home-buttons .btn-encuesta:first-child { margin-top: 0 !important; }
        @media (hover: hover) { .btn-encuesta:hover { background: linear-gradient(135deg, #22c55e, #15803d); border-color: #22c55e; box-shadow: 0 10px 30px rgba(34,197,94,0.28); } }

        .web-link { margin-top: 30px; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-align: center; color: #86efac; text-transform: uppercase; opacity: 0.85; }
        .signature { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; font-style: italic; text-transform: none; letter-spacing: 1px; color: #6b8a76; bottom: 26px; right: 0; left: 0; text-align: center; }

        .login-card { background: rgba(10,18,13,0.85); border: 1px solid rgba(74,222,128,0.25); border-radius: 18px; }
        .login-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; text-transform: none; letter-spacing: 1px; }
        .form-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(74,222,128,0.2); border-radius: 10px; padding: 14px; }
        .btn-login { border-radius: 10px; padding: 15px; letter-spacing: 3px; font-weight: 600; font-size: 12px; }

        .user-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(74,222,128,0.18); border-radius: 14px; }
        .alumno-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; }
        .tab-btn { border-radius: 10px; font-weight: 600; letter-spacing: 2px; background: rgba(255,255,255,0.03); border-color: rgba(74,222,128,0.18); }
        .btn-logout { background: transparent; border: 1px solid rgba(239,68,68,0.6); color: #fca5a5; letter-spacing: 2px; border-radius: 8px; padding: 6px 12px; }
        .btn-save-all { border-radius: 12px; letter-spacing: 2px; font-weight: 600; }

        /* Contenido de la rutina */
        #app-content { display: none; }

        .user-card { background: #151923; border: 1px solid #232936; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; align-items: center; }
        .user-card strong { color: #fff; }
        .alumno-title { font-size: 15px; color: #4ade80; font-weight: 800; }
        .btn-logout { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; }

        .nav-tabs-wrapper { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
        .nav-tabs { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding-bottom: 5px; }
        .tab-btn { padding: 10px 16px; background: #151923; border: 1px solid #232936; color: #64748b; font-weight: 800; font-size: 12px; border-radius: 6px; cursor: pointer; text-transform: uppercase; min-width: 120px; text-align: center; }
        .tab-btn.active { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; border-color: #22c55e; }

        .block { margin-bottom: 20px; border: 1px solid #232936; border-radius: 8px; overflow: hidden; background: #0f1219; }
        .block-header { background: #151923; border-left: 4px solid #22c55e; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; text-transform: uppercase; }
        .block-tag { color: #4ade80; font-size: 11px; }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #181d2a; color: #94a3b8; font-size: 11px; text-transform: uppercase; padding: 10px; border-bottom: 1px solid #232936; }
        td { padding: 10px; border-bottom: 1px solid #1a202c; color: #cbd5e1; }
        tr:last-child td { border-bottom: none; }
        tr.completed { opacity: 0.5; text-decoration: line-through; }

        .badge-num { background: #22c55e; color: #fff; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
        .checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #22c55e; }
        .input-carga { background: #1a202c; border: 1px solid #2d3748; color: #fff; padding: 6px 8px; border-radius: 6px; width: 80px; text-align: center; font-size: 12px; font-weight: 600; }
        .input-carga:focus { border-color: #22c55e; outline: none; }
        
        .btn-video { background: #16a34a; color: #fff; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-video:hover { background: #15803d; }

        /* Barra de guardado flotante */
        /* RPE */
        .rpe-box { margin-bottom: 20px; border: 1px solid #232936; border-radius: 8px; background: #0f1219; overflow: hidden; }
        .rpe-header { background: #151923; border-left: 4px solid #16a34a; padding: 10px 14px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .rpe-body { padding: 14px; }
        .rpe-hint { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .rpe-scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
        .rpe-btn { background: #151923; color: #e2e8f0; border: 1px solid #232936; border-radius: 6px; padding: 10px 0; font-weight: 800; font-size: 14px; cursor: pointer; transition: all 0.15s; }
        .rpe-btn:hover { border-color: #16a34a; }
        .rpe-btn.selected { background: linear-gradient(135deg, #22c55e, #16a34a); border-color: transparent; color: #fff; }
        .rpe-labels { display: flex; justify-content: space-between; font-size: 10px; color: #64748b; margin-top: 6px; text-transform: uppercase; font-weight: 700; }
        @media (max-width: 480px) { .rpe-scale { grid-template-columns: repeat(5, 1fr); } }
        /* PROGRESO */
        .tab-btn.progress-tab { border-color: #16a34a; color: #bbf7d0; }
        .tab-btn.progress-tab.active { background: linear-gradient(135deg, #16a34a, #166534); border-color: #16a34a; color: #fff; }
        .progress-box { border: 1px solid #232936; border-radius: 8px; background: #0f1219; overflow: hidden; margin-bottom: 20px; }
        .progress-header { background: #151923; border-left: 4px solid #16a34a; padding: 10px 14px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .progress-body { padding: 16px; }
        .progress-hint { font-size: 12px; color: #94a3b8; margin-bottom: 14px; }
        .progress-frame { width: 100%; height: 70vh; min-height: 420px; border: 1px solid #232936; border-radius: 8px; background: #fff; display: block; }
        .btn-open { display: inline-block; margin-top: 14px; background: linear-gradient(135deg, #16a34a, #166534); color: #fff; padding: 10px 22px; border-radius: 8px; font-weight: 800; font-size: 12px; text-transform: uppercase; text-decoration: none; }
        .btn-open:hover { opacity: 0.9; }
        .progress-msg { margin-top: 12px; font-size: 12px; font-weight: 700; }
        .progress-msg.ok { color: #22c55e; }
        .progress-msg.err { color: #ef4444; }
        .save-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #151923; border-top: 1px solid #232936; padding: 15px; display: flex; justify-content: center; align-items: center; gap: 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.6); z-index: 1000; }
        .btn-save-all { background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-weight: 900; font-size: 14px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); }
        .btn-save-all:hover { opacity: 0.9; }
        .save-msg { font-size: 13px; font-weight: 700; color: #22c55e; display: none; }

        /* ===== MEJORA PARA MÓVILES: bloques desplazables horizontalmente ===== */
        .block-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
        }

        .block-scroll table {
            width: 100%;
            min-width: 760px;
            table-layout: auto;
        }

        .block-scroll th,
        .block-scroll td {
            white-space: nowrap;
        }

        .block-scroll td:nth-child(2),
        .block-scroll th:nth-child(2) {
            min-width: 210px;
        }

        .exercise-name {
            white-space: nowrap;
            display: inline-block;
            vertical-align: middle;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
                padding-bottom: 120px;
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .top-bar {
                margin-bottom: 12px;
            }

            header {
                margin-bottom: 14px;
            }

            h1 {
                font-size: 20px;
            }

            .user-card {
                font-size: 12px;
                padding: 12px;
            }

            .block {
                width: 100%;
                overflow: hidden;
            }

            .block-header {
                min-width: 760px;
                padding: 12px 14px;
            }

            .block-scroll {
                width: 100%;
                overflow-x: auto;
                border-top: 0;
            }

            .block-scroll table {
                min-width: 760px;
                font-size: 13px;
            }

            .block-scroll th {
                padding: 10px 12px;
            }

            .block-scroll td {
                padding: 10px 12px;
                height: 66px;
            }

            .block-scroll td:nth-child(2),
            .block-scroll th:nth-child(2) {
                min-width: 230px;
                width: 230px;
            }

            .exercise-name {
                white-space: nowrap !important;
            }

            /* Evita que el nombre se corte en varias líneas */
            .block-scroll td:nth-child(2) {
                white-space: nowrap;
            }

            /* Indicador visual de que el bloque se puede deslizar */
            .block::after {
                content: '← DESLIZA HACIA EL COSTADO →';
                display: block;
                text-align: center;
                font-size: 9px;
                font-weight: 800;
                letter-spacing: .5px;
                color: #64748b;
                padding: 7px 0;
                background: #0f1219;
                border-top: 1px solid #1a202c;
            }
        }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <header>
        <div class="header-logo-container">
            <div>
                <span class="badge">SPORT FACTORY SYSTEM</span>
                <h1 id="tituloPlan" style="display:none;">Plan Semanal</h1>
            </div>
        </div>
        <div style="text-align: right;">
            <strong style="color: #22c55e;">ELITE COACHING</strong>
        </div>
    </header>

    <!-- PANTALLA DE ACCESO CON TU IMAGEN DE FONDO -->

        <div class="user-card">
            <div>ALUMNO/A: <span id="nombre-alumno" class="alumno-title">Atleta</span></div>
            <div><button class="btn-logout" onclick="logout()">Salir</button></div>
        </div>

        <div class="nav-tabs-wrapper">
            <div class="nav-tabs" id="tabs-container"></div>
        </div>

        <div id="blocks-container"></div>

        <!-- BARRA INFERIOR DE GUARDADO MANUAL -->
        <div class="save-bar">
            <button class="btn-save-all" onclick="guardarTodoElHistorial()">💾 Guardar Mis Pesos y RPE</button>
            <span id="saveMsg" class="save-msg">¡Pesos y RPE guardados con éxito! ✓</span>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxglkVG8To6azkP5RxKim9mCHfiHb-M1ltHsUuFP0qs86uUt0-WPJaT0PEQ73uylg4/exec";

        let allData = [];
        let routineDays = {};
        let activeDay = "";
        let currentUser = "";
        let rpeByDay = {};
        let showProgress = false;
        let progressUrl = "";

        // DOCUMENTO DE PROGRESO (solo lectura para los alumnos).
        // Subí el archivo a Google Drive, ponelo en "Cualquier persona con el enlace: Lector"
        // y pegá acá el enlace. También podés poner el enlace en una columna "progreso"
        // de la hoja (así cada alumno puede ver un documento distinto).
        const PROGRESO_URL = "";

        // PESTAÑA "PROGRESO" DE LA HOJA DE CÁLCULO.
        // En la hoja: una columna con el nombre del alumno y otra con el enlace del documento.
        // Luego: Archivo > Compartir > Publicar en la web > elegí SOLO la pestaña PROGRESO,
        // formato "Valores separados por comas (.csv)" > Publicar, y pegá el enlace acá.
        const PROGRESO_CSV_URL = "";

        function normalizarNombre(t) {
            return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase().replace(/\s+/g, " ");
        }

        function parseCSV(text) {
            const rows = [];
            let row = [], cell = "", inQ = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (inQ) {
                    if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
                    else if (c === '"') inQ = false;
                    else cell += c;
                } else if (c === '"') inQ = true;
                else if (c === ',') { row.push(cell); cell = ""; }
                else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i + 1] === '\n') i++;
                    row.push(cell); rows.push(row); row = []; cell = "";
                } else cell += c;
            }
            if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
            return rows;
        }

        // Busca en la pestaña PROGRESO la fila cuyo nombre coincide con el usuario o el nombre del alumno.
        // Si el alumno aparece más de una vez, se usa la última fila (la más reciente).
        async function buscarProgresoEnHoja(nombres) {
            if (!PROGRESO_CSV_URL) return "";
            try {
                const resp = await fetch(PROGRESO_CSV_URL);
                if (!resp.ok) return "";
                const filas = parseCSV(await resp.text());
                const buscados = nombres.map(normalizarNombre).filter(Boolean);
                let encontrado = "";
                filas.forEach(celdas => {
                    const link = celdas.map(c => c.trim()).find(c => /^https?:\/\//i.test(c));
                    if (!link) return;
                    const nombre = celdas.map(c => c.trim()).find(c => c && !/^https?:\/\//i.test(c));
                    if (nombre && buscados.includes(normalizarNombre(nombre))) encontrado = link;
                });
                return encontrado;
            } catch (e) {
                console.error("No se pudo leer la pestaña PROGRESO", e);
                return "";
            }
        }

        function mostrarLogin() {
            document.getElementById('animalLogo').style.display = 'none';
            document.getElementById('homeDeco').style.display = 'none';
            document.getElementById('webLink').style.display = 'none';
            document.getElementById('btnReady').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
        }

        function ocultarLogin() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('btnReady').style.display = 'block';
            document.getElementById('animalLogo').style.display = 'block';
            document.getElementById('homeDeco').style.display = 'flex';
            document.getElementById('webLink').style.display = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('menuDiaria').style.display = 'none';
        }

        let modoGeneral = false;

        async function mostrarRutina(userRows, alumnoNombre) {
            progressUrl = PROGRESO_URL;
            if (!modoGeneral) {
                const rowConProgreso = userRows.find(r => r.progreso && String(r.progreso).trim());
                progressUrl = rowConProgreso ? String(rowConProgreso.progreso).trim() : PROGRESO_URL;
                const urlDeHoja = await buscarProgresoEnHoja([currentUser, alumnoNombre]);
                if (urlDeHoja) progressUrl = urlDeHoja;
            }
            document.getElementById('nombre-alumno').innerText = alumnoNombre;

            routineDays = {};
            userRows.forEach(row => {
                let dia = row.dia || "Día 1";
                let bloque = row.bloque || "Bloque 1";
                let tag = row.tag || "";
                if (!routineDays[dia]) routineDays[dia] = {};
                if (!routineDays[dia][bloque]) routineDays[dia][bloque] = { tag: tag, exercises: [] };
                routineDays[dia][bloque].exercises.push({
                    name: row.ejercicio,
                    series: row.series,
                    reps: row.reps,
                    carga: row.carga || "",
                    video: row.video
                });
            });

            const daysList = Object.keys(routineDays);
            if (daysList.length > 0) activeDay = daysList[0];

            document.getElementById('tituloPlan').style.display = '';
            document.querySelector('.save-bar').style.display = modoGeneral ? 'none' : '';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            render();
        }

        function mostrarMenuDiaria(ver) {
            document.getElementById('btnReady').style.display = ver ? 'none' : 'block';
            document.getElementById('menuDiaria').style.display = ver ? 'block' : 'none';
        }

        async function entrarRutinaDiaria(tipo) {
            try {
                const response = await fetch(WEB_APP_URL);
                allData = await response.json();
                const filas = allData.filter(r => {
                    const u = String(r.usuario).trim().toLowerCase();
                    return u === tipo;
                });
                if (filas.length === 0) {
                    alert("Todavía no hay rutina cargada para " + tipo + ".");
                    return;
                }
                modoGeneral = true;
                currentUser = "";
                rpeByDay = {};
                showProgress = false;
                mostrarRutina(filas, tipo.replace(/\b\w/g, c => c.toUpperCase()));
            } catch (e) {
                alert("Error de conexión con Google Sheets.");
            }
        }

        async function login() {
            currentUser = document.getElementById('userInput').value.trim().toLowerCase();
            const passVal = document.getElementById('passInput').value.trim();
            const errorDiv = document.getElementById('errorMsg');

            if (!currentUser || !passVal) {
                errorDiv.innerText = "Por favor completa ambos campos.";
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.style.display = "none";

            try {
                const response = await fetch(WEB_APP_URL);
                allData = await response.json();

                const userRows = allData.filter(row => 
                    String(row.usuario).trim().toLowerCase() === currentUser && 
                    String(row.codigo).trim() === passVal
                );

                if (userRows.length === 0) {
                    errorDiv.innerText = "Usuario o código incorrectos.";
                    errorDiv.style.display = "block";
                    return;
                }

                modoGeneral = false;
                mostrarRutina(userRows, userRows[0].alumno || currentUser);
            } catch (error) {
                errorDiv.innerText = "Error de conexión con Google Sheets.";
                errorDiv.style.display = "block";
            }
        }

        async function guardarTodoElHistorial() {
            const inputs = document.querySelectorAll('.input-carga');
            const saveMsg = document.getElementById('saveMsg');
            
            let cargasData = [];
            inputs.forEach(input => {
                cargasData.push({
                    ejercicio: input.getAttribute('data-ejercicio'),
                    carga: input.value || "Sin carga"
                });
            });

            // RPE de cada rutina (día). Se guarda junto a los pesos como un registro más
            // y también como campo aparte por si el script de Google lo quiere leer.
            let rpeData = [];
            Object.keys(rpeByDay).forEach(dia => {
                if (rpeByDay[dia]) {
                    rpeData.push({ dia: dia, rpe: rpeByDay[dia] });
                    cargasData.push({
                        ejercicio: "RPE - " + dia,
                        carga: String(rpeByDay[dia])
                    });
                }
            });

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        usuario: currentUser, 
                        registros: cargasData,
                        rpe: rpeData
                    })
                });

                saveMsg.style.display = "inline";
                setTimeout(() => {
                    saveMsg.style.display = "none";
                }, 3000);
            } catch (err) {
                console.error("Error al registrar historial", err);
                alert("Hubo un error al guardar. Revisa tu conexión.");
            }
        }

        function logout() {
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            ocultarLogin();
            document.getElementById('tituloPlan').style.display = 'none';
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
            routineDays = {};
            rpeByDay = {};
            showProgress = false;
            progressUrl = "";
            activeDay = "";
            currentUser = "";
            modoGeneral = false;
        }

        function render() {
            const daysList = Object.keys(routineDays);
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            daysList.forEach(day => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${(!showProgress && day === activeDay) ? 'active' : ''}`;
                btn.innerText = day;
                btn.onclick = () => { activeDay = day; showProgress = false; rpeByDay = {}; render(); };
                tabsContainer.appendChild(btn);
            });

            const progBtn = document.createElement('button');
            progBtn.className = `tab-btn progress-tab ${showProgress ? 'active' : ''}`;
            progBtn.innerText = 'PROGRESO';
            progBtn.onclick = () => { showProgress = true; rpeByDay = {}; render(); };
            if (!modoGeneral) tabsContainer.appendChild(progBtn);

            document.querySelector('.save-bar').style.display = (showProgress || modoGeneral) ? 'none' : 'flex';

            const blocksContainer = document.getElementById('blocks-container');
            blocksContainer.innerHTML = '';

            if (showProgress) {
                blocksContainer.appendChild(renderProgressBox());
                return;
            }

            if (activeDay && routineDays[activeDay]) {
                const blocks = routineDays[activeDay];
                Object.keys(blocks).forEach(blockName => {
                    const blockData = blocks[blockName];
                    const blockDiv = document.createElement('div');
                    blockDiv.className = 'block';
                    
                    let rowsHtml = '';
                    blockData.exercises.forEach((ex, idx) => {
                        let safeName = String(ex.name).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                        
                        rowsHtml += `
                            <tr>
                                <td style="text-align: center;"><input type="checkbox" class="checkbox" onclick="toggleRow(this)"></td>
                                <td>
                                    <span class="badge-num">${idx + 1}</span> 
                                    <span class="exercise-name">${ex.name}</span>
                                </td>
                                <td style="text-align: center;">${ex.series}</td>
                                <td style="text-align: center;">${ex.reps}</td>
                                <td style="text-align: center;"><input type="text" class="input-carga" value="${ex.carga}" data-ejercicio="${safeName}" placeholder="Kg"></td>
                                <td style="text-align: center;"><a href="${ex.video}" target="_blank" class="btn-video">▶ Ver</a></td>
                            </tr>
                        `;
                    });

                    blockDiv.innerHTML = `
                        <div class="block-header">
                            <span>${blockName}</span>
                            <span class="block-tag">${blockData.tag}</span>
                        </div>
                        <div class="block-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 40px; text-align: center;">✓</th>
                                    <th>Ejercicio</th>
                                    <th style="text-align: center;">Series</th>
                                    <th style="text-align: center;">Reps</th>
                                    <th style="text-align: center;">Carga</th>
                                    <th style="text-align: center;">Vídeo</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                        </div>
                    `;
                    blocksContainer.appendChild(blockDiv);
                });
                if (!modoGeneral) blocksContainer.appendChild(renderRpeBox(activeDay));
            }
        }

        function toPreviewUrl(url) {
            const open = url.match(/drive\.google\.com\/open\?(?:.*&)?id=([^&#]+)/);
            if (open) return 'https://drive.google.com/file/d/' + open[1] + '/preview';
            return url.replace(/\/(edit|view)(\?[^#]*)?(#.*)?$/, '/preview');
        }

        function renderProgressBox() {
            const box = document.createElement('div');
            box.className = 'progress-box';
            const url = String(progressUrl || '').trim();

            if (!/^https?:\/\//i.test(url)) {
                box.innerHTML = `
                    <div class="progress-header">Progreso</div>
                    <div class="progress-body">
                        <div class="progress-hint" style="margin:0;">Todavía no hay ningún documento de progreso cargado.</div>
                    </div>
                `;
                return box;
            }

            box.innerHTML = `
                <div class="progress-header">Progreso</div>
                <div class="progress-body">
                    <iframe class="progress-frame" title="Documento de progreso"></iframe>
                    <a class="btn-open" target="_blank" rel="noopener">Abrir en pantalla completa ↗</a>
                </div>
            `;
            box.querySelector('iframe').src = toPreviewUrl(url);
            box.querySelector('a').href = url;
            return box;
        }

        function setRpe(day, value) {
            rpeByDay[day] = (rpeByDay[day] === value) ? null : value;
            render();
        }

        function renderRpeBox(day) {
            const current = rpeByDay[day];
            let btns = '';
            for (let i = 1; i <= 10; i++) {
                btns += `<button type="button" class="rpe-btn ${current === i ? 'selected' : ''}" data-rpe="${i}">${i}</button>`;
            }
            const box = document.createElement('div');
            box.className = 'rpe-box';
            box.innerHTML = `
                <div class="rpe-header">RPE · ${day}</div>
                <div class="rpe-body">
                    <div class="rpe-hint">Del 1 al 10, ¿qué tan intenso te resultó este entrenamiento?</div>
                    <div class="rpe-scale">${btns}</div>
                    <div class="rpe-labels"><span>1 · Muy suave</span><span>10 · Máximo esfuerzo</span></div>
                </div>
            `;
            box.querySelectorAll('.rpe-btn').forEach(b => {
                b.onclick = () => setRpe(day, parseInt(b.getAttribute('data-rpe'), 10));
            });
            return box;
        }

        function toggleRow(checkbox) { 
            checkbox.closest('tr').classList.toggle('completed', checkbox.checked); 
        }
    </script>
</body>
</html>
